name: CI
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Unit and clean package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test .github/scripts/release-gates.test.cjs
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: node .github/scripts/package-smoke.cjs
  runtime:
    name: Legacy runtime archive / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['14.21.3', '20']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # No dev tooling on legacy Node: test the actual clean installed tarball.
      - run: node .github/scripts/package-smoke.cjs
